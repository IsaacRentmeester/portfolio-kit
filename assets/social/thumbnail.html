<!doctype html>
<!-- Source for portfolio-kit-thumbnail.png (1200×627, LinkedIn / GitHub social preview).
     Rebuild: headless Chrome --window-size=1200,627 --screenshot (see MAINTAINING.md). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:627px;overflow:hidden}
  body{background:radial-gradient(900px 600px at 95% 110%,#7a0019 0%,transparent 60%),radial-gradient(600px 400px at 0% 0%,rgba(255,204,51,.10),transparent 70%),#12060a;
    font-family:"IBM Plex Sans",system-ui,sans-serif;color:#fff;position:relative}
  .copy{position:absolute;left:64px;top:70px;width:460px}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:17px;letter-spacing:.18em;color:#ffcc33;text-transform:uppercase;display:flex;align-items:center;gap:12px}
  .eyebrow:after{content:"";width:70px;height:1px;background:#ffcc33;opacity:.5}
  h1{font-size:76px;line-height:.98;letter-spacing:-.035em;margin:22px 0 0;font-weight:700}
  h1 span{color:#ffcc33}
  p{font-size:25px;line-height:1.35;color:#e0c9cf;margin:26px 0 0;font-weight:500}
  .steps{position:absolute;left:64px;bottom:62px;display:flex;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:16px}
  .steps b{font-weight:500;padding:9px 14px;border-radius:999px;background:rgba(255,204,51,.1);color:#ffcc33;box-shadow:inset 0 0 0 1px rgba(255,204,51,.25)}
  .steps i{font-style:normal;color:#e0c9cf;align-self:center}
  .shot{position:absolute;left:580px;top:78px;width:700px;border-radius:14px;overflow:hidden;
    box-shadow:0 40px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.1);transform:rotate(-2.5deg);background:#1d0a10}
  .bar{height:30px;display:flex;align-items:center;gap:7px;padding:0 14px;background:#2a1019}
  .bar span{width:10px;height:10px;border-radius:50%;background:#5a3a43}
  .bar em{margin-left:14px;font:500 13px "IBM Plex Mono",monospace;color:#e0c9cf;font-style:normal}
  .shot img{display:block;width:100%}
</style></head><body>
  <div class="copy">
    <div class="eyebrow">Portfolio Kit</div>
    <h1>Your portfolio site, <span>built with Claude.</span></h1>
    <p>Drop in your résumé and LinkedIn. Get a live site on your profile. Free, in about 45 minutes.</p>
  </div>
  <div class="steps"><b>résumé</b><i>→</i><b>live on Vercel</b><i>→</i><b>LinkedIn</b></div>
  <figure class="shot" style="margin:0"><div class="bar"><span></span><span></span><span></span><em>yourname.vercel.app</em></div><img src="site-shot.png" alt=""></figure>
</body></html>
